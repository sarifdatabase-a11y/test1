<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Web App</title>
  
  <!-- ১. গুগল অথ লাইব্রেরি -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- ২. ইউজার যদি আগে থেকেই লগইন থাকে, তবে সরাসরি index.html এ পাঠাবে -->
  <script>
    if (localStorage.getItem('user')) {
      window.location.href = "index.html";
    }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .login-card { background: white; padding: 35px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    .login-card h2 { color: #1a73e8; margin-bottom: 8px; font-size: 24px; }
    .login-card p { color: #666; font-size: 14px; margin-bottom: 25px; }

    .form-group { text-align: left; margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; font-size: 13px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
    .form-group input:focus { border-color: #1a73e8; }

    .btn-submit { width: 100%; background-color: #1a73e8; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 5px; }
    .btn-submit:hover { background-color: #1557b0; }

    .divider { display: flex; align-items: center; text-align: center; margin: 20px 0; color: #aaa; font-size: 13px; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #ddd; }
    .divider:not(:empty)::before { margin-right: .5em; }
    .divider:not(:empty)::after { margin-left: .5em; }

    .google-btn-wrapper { display: flex; justify-content: center; }
    
    .footer-text { margin-top: 20px; font-size: 13px; color: #666; }
    .footer-text a { color: #1a73e8; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Welcome Back</h2>
    <p>আপনার অ্যাকাউন্ট দিয়ে লগইন করুন</p>

    <!-- ম্যানুয়াল ফরম -->
    <form id="loginForm" onsubmit="handleManualLogin(event)">
      <div class="form-group">
        <label for="mobile">Mobile Number (User ID):</label>
        <input type="text" id="mobile" placeholder="017xxxxxxxx" required>
      </div>

      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">Login</button>
    </form>

    <div class="divider">OR</div>

    <!-- গুগল সাইন-ইন বাটন (নতুন Client ID সহ) -->
    <div class="google-btn-wrapper">
      <div id="g_id_onload"
           data-client_id="30571388466-bs9rkruekko82lvqc5a7jncmjnv7hjap.apps.googleusercontent.com"
           data-callback="handleCredentialResponse">
      </div>

      <div class="g_id_signin"
           data-type="standard"
           data-size="large"
           data-theme="outline"
           data-text="sign_in_with"
           data-shape="rectangular"
           data-logo_alignment="left">
      </div>
    </div>

    <div class="footer-text">
      অ্যাকাউন্ট নেই? <a href="reg.html">রেজিস্ট্রেশন করুন</a>
    </div>
  </div>

  <script>
    // ১. ম্যানুয়াল মোবাইল/পাসওয়ার্ড দিয়ে লগইন
    function handleManualLogin(event) {
      event.preventDefault();
      
      const mobileInput = document.getElementById('mobile').value.trim();
      const passwordInput = document.getElementById('password').value.trim();

      const registeredUsers = JSON.parse(localStorage.getItem('usersList')) || [];
      const validUser = registeredUsers.find(u => u.mobile === mobileInput && u.password === passwordInput);

      if (validUser) {
        const loggedInUser = {
          name: validUser.name,
          mobile: validUser.mobile,
          email: validUser.email
        };
        localStorage.setItem('user', JSON.stringify(loggedInUser));
        window.location.href = "index.html";
      } else {
        alert("মোবাইল নম্বর অথবা পাসওয়ার্ড ভুল হয়েছে!");
      }
    }

    // ২. গুগল টোকেন ডিকোড করার ফাংশন
    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    // ৩. গুগল দিয়ে সফলভাবে লগইন হ্যান্ডেল করা
    function handleCredentialResponse(response) {
      const responsePayload = parseJwt(response.credential);

      const googleUser = {
        name: responsePayload.name,
        email: responsePayload.email,
        mobile: "Google Auth User"
      };

      localStorage.setItem('user', JSON.stringify(googleUser));
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
